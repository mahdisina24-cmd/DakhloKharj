name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
      - name: Align Expo package versions
        run: |
          for attempt in 1 2 3; do
            npx expo install --fix && exit 0
            echo "Expo dependency alignment failed (attempt $attempt/3); retrying in 15 seconds..."
            sleep 15
          done
          exit 1
      - name: Verify Expo dependency tree
        run: npx expo-doctor
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dakhlo-kharj-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
