name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'assets/icon.svg'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000
      - name: Align Expo package versions
        run: |
          for attempt in 1 2 3; do
            npx expo install --fix && exit 0
            echo "Expo dependency alignment failed (attempt $attempt/3); retrying in 15 seconds..."
            sleep 15
          done
          exit 1
      - name: Verify Expo dependency tree
        run: npx expo-doctor
      - name: Generate PNG app icon from SVG
        run: |
          python - <<'PY'
          import struct, zlib
          # Generate a simple, valid 1024x1024 RGB PNG icon without external image tools.
          w = h = 1024
          rows = []
          for y in range(h):
              row = bytearray([0])
              for x in range(w):
                  # teal background with a simple white wallet/card motif
                  edge = min(x, y, w-1-x, h-1-y)
                  if 220 < x < 805 and 300 < y < 720:
                      if 520 < x < 845 and 445 < y < 610:
                          c = (15, 118, 110)
                      else:
                          c = (240, 253, 250)
                  elif 90 < x < 290 and 620 < y < 820 and (x-190)**2 + (y-720)**2 < 100**2:
                      c = (245, 158, 11)
                  else:
                      c = (15, 118, 110) if edge > 20 else (6, 78, 74)
                  row.extend(c)
              rows.append(bytes(row))
          def chunk(t, d):
              return struct.pack('!I', len(d)) + t + d + struct.pack('!I', zlib.crc32(t+d) & 0xffffffff)
          png = bytes([137,80,78,71,13,10,26,10]) + chunk(b'IHDR', struct.pack('!2I5B', w, h, 8, 2, 0, 0, 0)) + chunk(b'IDAT', zlib.compress(b''.join(rows), 6)) + chunk(b'IEND', b'')
          open('assets/icon.png', 'wb').write(png)
          PY
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dakhlo-kharj-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
