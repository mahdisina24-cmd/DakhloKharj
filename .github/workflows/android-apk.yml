name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'assets/icon.svg'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: dakhlo-kharj-android-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK (single sequential job)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 4. Install dependencies
        run: |
          set -euxo pipefail
          npm install --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: 5. Generate PNG app icon
        run: |
          set -euxo pipefail
          python - <<'PY'
          import struct, zlib
          w = h = 1024
          rows = []
          for y in range(h):
              row = bytearray([0])
              for x in range(w):
                  if 220 < x < 805 and 300 < y < 720:
                      c = (15, 118, 110) if (520 < x < 845 and 445 < y < 610) else (240, 253, 250)
                  elif 90 < x < 290 and 620 < y < 820 and (x-190)**2 + (y-720)**2 < 100**2:
                      c = (245, 158, 11)
                  else:
                      c = (15, 118, 110)
                  row.extend(c)
              rows.append(bytes(row))
          def chunk(kind, data):
              return struct.pack('!I', len(data)) + kind + data + struct.pack('!I', zlib.crc32(kind + data) & 0xffffffff)
          png = bytes([137, 80, 78, 71, 13, 10, 26, 10])
          png += chunk(b'IHDR', struct.pack('!2I5B', w, h, 8, 2, 0, 0, 0))
          png += chunk(b'IDAT', zlib.compress(b''.join(rows), 6))
          png += chunk(b'IEND', b'')
          with open('assets/icon.png', 'wb') as f:
              f.write(png)
          print('Created assets/icon.png')
          PY
          file assets/icon.png

      - name: 6. Generate Android project
        run: |
          set -euxo pipefail
          npx expo prebuild --platform android --non-interactive

      - name: 7. Build release APK
        working-directory: android
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 8. Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: dakhlo-kharj-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
