name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'App.tsx'
      - 'app.json'
      - 'assets/icon.svg'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/android-apk.yml'

concurrency:
  group: dakhlo-kharj-android-apk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build APK (single sequential job)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Set up Java for Android
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 4. Install dependencies
        run: |
          set -euxo pipefail
          npm install --no-audit --no-fund --fetch-retries=5 --fetch-retry-mintimeout=20000 --fetch-retry-maxtimeout=120000

      - name: 5. Render app icon from SVG
        run: |
          set -euxo pipefail
          python -m pip install --disable-pip-version-check cairosvg
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url='assets/icon.svg', write_to='assets/icon.png', output_width=1024, output_height=1024)
          print('Rendered assets/icon.png from assets/icon.svg')
          PY
          file assets/icon.png

      - name: 6. Generate Android project
        run: |
          set -euxo pipefail
          npx expo prebuild --platform android --non-interactive

      - name: 7. Build release APK
        working-directory: android
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 8. Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: dakhlo-kharj-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
